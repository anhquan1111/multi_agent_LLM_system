[project]
name = "multi-agent-llm-system"
version = "0.1.0"
description = "Multi-agent e-commerce support assistant: supervisor routing between a policy RAG agent, a read-only order/data agent, and a gated write-action agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: hits the FastAPI app end to end (still mocks the LLM)",
    "live: requires a real GOOGLE_API_KEY and network; excluded from CI",
]
